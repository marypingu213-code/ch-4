<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二關：句子重組</title>
    <script src="data_lesson2.js?v=2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'BiaoKai', 'DFKai-SB', '楷體-繁', 'Kaiti TC', serif;
            background-color: #e0f2fe; /* 水藍色背景 */
            background-image: radial-gradient(#bae6fd 3px, transparent 3px);
            background-size: 40px 40px;
            user-select: none; 
            overflow: hidden; 
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 2.5s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* 句子字卡拖曳樣式 */
        .sentence-card {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .sentence-card.is-dragging {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 1000 !important;
        }
        
        /* 放置區的虛線框 */
        .drop-slot {
            transition: background-color 0.2s, border-color 0.2s;
        }
        .drop-slot.drag-over {
            background-color: #dbeafe;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="h-screen w-screen text-gray-800 flex flex-col items-center justify-center p-2 lg:p-4">

    <div class="w-full h-full max-w-[1800px] max-h-[1200px] bg-white/95 backdrop-blur-sm p-3 sm:p-6 lg:p-8 rounded-[2rem] lg:rounded-[3rem] shadow-2xl relative border-4 lg:border-8 border-blue-200 flex flex-col">
        
        <a href="index.html" class="absolute top-4 left-4 lg:top-6 lg:left-6 text-gray-400 hover:text-blue-600 transition-colors text-xl lg:text-2xl font-bold flex items-center gap-2 no-underline z-20">
            <i class="fa-solid fa-arrow-left font-sans"></i> 回大廳
        </a>

        <div id="lessonSelectionScreen" class="flex-grow flex flex-col items-center justify-center w-full z-10 pb-8">
            <h1 class="text-5xl lg:text-7xl font-black text-blue-500 mb-12 drop-shadow-sm flex items-center gap-4 tracking-widest">
                <i class="fa-solid fa-list-ol text-blue-300 font-sans"></i>
                請選擇課次
            </h1>
            
            <div id="lessonGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 lg:gap-10 w-full max-w-6xl px-6">
                </div>
        </div>

        <div id="gameScreen" class="hidden flex-grow flex-col items-center w-full relative z-10">
            
            <button onclick="backToSelection()" class="absolute top-0 right-2 lg:top-0 lg:right-2 bg-blue-100 text-blue-600 hover:bg-blue-200 px-4 py-2 rounded-full font-bold text-base lg:text-lg transition-colors z-30">
                <i class="fa-solid fa-rotate-left font-sans mr-1"></i> 重選課次
            </button>

            <div class="text-center w-full mb-2 lg:mb-4 mt-8 lg:mt-2">
                <h2 id="currentLessonTitle" class="text-2xl lg:text-4xl font-bold text-blue-500 mb-2 tracking-widest">第一課</h2>
                <div class="w-full max-w-3xl mx-auto bg-gray-200 rounded-full h-3 lg:h-4 overflow-hidden shadow-inner mt-1">
                    <div id="progressBar" class="bg-gradient-to-r from-blue-400 to-cyan-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-base lg:text-lg text-gray-400 font-bold mt-1 text-center font-sans">0 / 0</p>
            </div>

            <div class="flex-grow flex flex-col w-full gap-2 lg:gap-4 relative z-10 px-2 lg:px-8 max-w-5xl mx-auto pb-2">
                
                <div class="w-full bg-blue-50/80 border-[4px] border-blue-200 rounded-[1.5rem] lg:rounded-[2rem] p-3 lg:p-5 flex flex-col gap-2 lg:gap-3" id="targetArea">
                    <div class="text-blue-500 font-black text-xl lg:text-2xl mb-1 flex items-center gap-3">
                        <i class="fa-solid fa-layer-group font-sans"></i> 組合區
                    </div>
                    </div>

                <div class="w-full bg-gray-50 border-[4px] border-gray-200 rounded-[1.5rem] lg:rounded-[2rem] p-3 lg:p-5 flex flex-wrap justify-center items-center gap-3 lg:gap-4 min-h-[100px] lg:min-h-[130px]" id="optionsArea">
                    </div>

                <div class="w-full flex justify-center mt-1 h-[50px]">
                    <button id="finishBtn" onclick="checkAnswer()" class="hidden bg-green-500 hover:bg-green-600 text-white text-xl lg:text-3xl font-bold py-2 px-10 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 tracking-widest">
                        <i class="fa-solid fa-check mr-2 font-sans"></i> 我排好了
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div id="feedbackModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden pointer-events-none">
        <div class="bg-white rounded-[2rem] lg:rounded-[3rem] p-10 lg:p-16 flex flex-col items-center shadow-2xl animate-popIn pointer-events-auto transition-transform">
            <div id="feedbackIcon" class="text-[6rem] lg:text-[10rem] mb-4"></div>
            <h2 id="feedbackText" class="text-4xl lg:text-6xl font-black tracking-widest"></h2>
        </div>
    </div>

    <div id="completionModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-[3rem] lg:rounded-[4rem] p-10 lg:p-20 flex flex-col items-center shadow-2xl animate-popIn border-[10px] border-blue-400 max-w-2xl text-center">
            <i class="fa-solid fa-medal text-[8rem] lg:text-[12rem] text-yellow-400 mb-6 animate-float font-sans"></i>
            <h2 class="text-5xl lg:text-7xl font-black text-blue-600 mb-4 drop-shadow-sm tracking-widest">挑戰成功！</h2>
            <p class="text-2xl lg:text-3xl font-bold text-gray-600 mb-10">你已完成本課句子重組！</p>
            <div class="flex gap-4 justify-center">
                <button onclick="backToSelection()" class="bg-blue-100 text-blue-600 border-4 border-blue-300 text-2xl lg:text-3xl font-black py-4 px-8 rounded-full shadow-lg hover:scale-105 transition-all tracking-widest">
                    選其他課
                </button>
                <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white text-2xl lg:text-3xl font-black py-4 px-8 rounded-full shadow-lg hover:scale-105 transition-all tracking-widest">
                    回大廳
                </button>
            </div>
        </div>
    </div>

    <script>
        if (typeof lessonData2 === 'undefined') {
            alert("題庫載入失敗！請確認 'data_lesson2.js' 檔案是否正確。");
        }

        let currentLessonKey = "";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let originalOrder = []; 

        window.onload = () => {
            if (typeof lessonData2 !== 'undefined') {
                renderLessonSelection();
            }
        };

        // 產生 1~12 課的按鈕
        function renderLessonSelection() {
            const lessonGrid = document.getElementById('lessonGrid');
            lessonGrid.innerHTML = '';
            
            for (let i = 1; i <= 12; i++) {
                const lessonKey = `lesson${i}`;
                const hasQuestions = lessonData2[lessonKey] && lessonData2[lessonKey].length > 0;
                
                const btn = document.createElement('button');
                
                if (hasQuestions) {
                    btn.className = "bg-white border-4 border-blue-300 text-blue-600 text-3xl lg:text-5xl font-black py-8 lg:py-12 rounded-2xl lg:rounded-[2.5rem] shadow-lg hover:bg-blue-50 hover:shadow-2xl transition-transform hover:-translate-y-2 tracking-widest";
                    btn.innerText = `第 ${i} 課`;
                    btn.onclick = () => startLesson(lessonKey, i);
                } else {
                    btn.className = "bg-gray-100 border-4 border-gray-200 text-gray-400 text-3xl lg:text-5xl font-black py-8 lg:py-12 rounded-2xl lg:rounded-[2.5rem] shadow-sm cursor-not-allowed tracking-widest relative overflow-hidden";
                    btn.innerHTML = `第 ${i} 課 <span class="absolute text-sm bg-gray-300 text-white px-3 py-1 rounded-full bottom-3 right-3 font-sans shadow-inner">無題目</span>`;
                }
                
                lessonGrid.appendChild(btn);
            }
        }

        function startLesson(lessonKey, lessonNumber) {
            currentLessonKey = lessonKey;
            currentQuestions = [...lessonData2[lessonKey]];
            currentQuestionIndex = 0;

            document.getElementById('currentLessonTitle').innerText = `第 ${lessonNumber} 課`;
            
            document.getElementById('lessonSelectionScreen').classList.add('hidden');
            document.getElementById('lessonSelectionScreen').classList.remove('flex');
            
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex', 'animate-popIn');
            
            document.getElementById('completionModal').classList.add('hidden');

            updateProgress();
            loadQuestion();
        }

        function backToSelection() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('flex');
            
            const selectionScreen = document.getElementById('lessonSelectionScreen');
            selectionScreen.classList.remove('hidden');
            selectionScreen.classList.add('flex', 'animate-popIn');
            
            document.getElementById('completionModal').classList.add('hidden');
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const percentage = (currentQuestionIndex / currentQuestions.length) * 100;
            progressBar.style.width = percentage + '%';
            progressText.innerText = (currentQuestionIndex + 1) + ' / ' + currentQuestions.length;
        }

        function loadQuestion() {
            document.getElementById('finishBtn').classList.add('hidden');
            const targetArea = document.getElementById('targetArea');
            const optionsArea = document.getElementById('optionsArea');
            
            targetArea.innerHTML = `<div class="text-blue-500 font-black text-xl lg:text-2xl mb-1 flex items-center gap-3"><i class="fa-solid fa-layer-group font-sans"></i> 組合區</div>`;
            optionsArea.innerHTML = '';

            const currentData = currentQuestions[currentQuestionIndex];
            originalOrder = currentData.sentence; 
            
            // 建立插槽 (高度調降，文字縮小)
            originalOrder.forEach((_, index) => {
                const slot = document.createElement('div');
                slot.className = "drop-slot w-full h-[50px] sm:h-[60px] lg:h-[75px] border-4 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-gray-400 font-bold text-base lg:text-xl bg-white/50 tracking-widest transition-colors";
                slot.dataset.slotIndex = index;
                slot.innerHTML = `<span>放這裡 (${index + 1})</span>`;
                targetArea.appendChild(slot);
            });

            // 打散字卡並生成
            let shuffledPhrases = [...originalOrder].sort(() => Math.random() - 0.5);
            
            shuffledPhrases.forEach((phrase) => {
                const card = document.createElement('div');
                // 字卡 padding 調小，字體調小
                card.className = "sentence-card touch-none bg-white border-4 border-blue-400 text-blue-800 rounded-xl px-4 py-2 lg:px-6 lg:py-3 text-xl lg:text-3xl font-bold shadow-sm cursor-grab active:cursor-grabbing text-center min-w-[120px] flex items-center justify-center tracking-wide";
                card.textContent = phrase;
                card.dataset.phrase = phrase;
                card.addEventListener('pointerdown', onPointerDown);
                optionsArea.appendChild(card);
            });
        }

        // --- 拖曳核心邏輯 ---
        let draggedCard = null;
        let shiftX = 0, shiftY = 0;
        let placeholder = null;

        function onPointerDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault();
            
            draggedCard = e.currentTarget;
            draggedCard.classList.add('is-dragging');
            
            const rect = draggedCard.getBoundingClientRect();
            shiftX = e.clientX - rect.left;
            shiftY = e.clientY - rect.top;
            
            placeholder = document.createElement('div');
            placeholder.className = draggedCard.className;
            placeholder.classList.remove('is-dragging');
            placeholder.style.visibility = 'hidden';
            draggedCard.parentNode.insertBefore(placeholder, draggedCard);
            
            document.body.appendChild(draggedCard);
            draggedCard.style.position = 'fixed';
            draggedCard.style.zIndex = '9999';
            draggedCard.style.pointerEvents = 'none';
            
            moveAt(e.clientX, e.clientY);
        }

        function onPointerMove(e) {
            if (!draggedCard) return;
            e.preventDefault();
            moveAt(e.clientX, e.clientY);
        }

        function moveAt(pageX, pageY) {
            draggedCard.style.left = pageX - shiftX + 'px';
            draggedCard.style.top = pageY - shiftY + 'px';
        }

        function onPointerUp(e) {
            if (!draggedCard) return;
            
            draggedCard.style.display = 'none';
            const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            draggedCard.style.display = '';
            
            draggedCard.classList.remove('is-dragging');
            draggedCard.style.position = '';
            draggedCard.style.left = '';
            draggedCard.style.top = '';
            draggedCard.style.zIndex = '';
            draggedCard.style.pointerEvents = 'auto'; 
            
            let targetSlot = elemBelow ? elemBelow.closest('.drop-slot') : null;
            const optionsArea = document.getElementById('optionsArea');
            
            if (targetSlot) {
                const existingCard = targetSlot.querySelector('.sentence-card');
                if (existingCard) {
                    optionsArea.appendChild(existingCard);
                    existingCard.style.width = 'auto';
                    existingCard.style.height = 'auto';
                }
                targetSlot.innerHTML = '';
                targetSlot.appendChild(draggedCard);
                draggedCard.style.width = '100%'; 
                draggedCard.style.height = '100%';
            } else {
                optionsArea.appendChild(draggedCard);
                draggedCard.style.width = 'auto';
                draggedCard.style.height = 'auto';
            }
            
            if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
            
            checkIfFull();
            draggedCard = null;
            placeholder = null;
        }

        document.addEventListener('pointermove', onPointerMove, { passive: false });
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerUp);

        function checkIfFull() {
            const slots = document.querySelectorAll('.drop-slot');
            let isFull = true;
            slots.forEach(slot => {
                if (!slot.querySelector('.sentence-card')) isFull = false;
            });

            const finishBtn = document.getElementById('finishBtn');
            if (isFull) {
                finishBtn.classList.remove('hidden');
                finishBtn.classList.add('animate-popIn');
            } else {
                finishBtn.classList.add('hidden');
                finishBtn.classList.remove('animate-popIn');
            }
        }

        function checkAnswer() {
            const slots = document.querySelectorAll('.drop-slot');
            let isCorrect = true;

            slots.forEach((slot, index) => {
                const card = slot.querySelector('.sentence-card');
                if (card.dataset.phrase !== originalOrder[index]) {
                    isCorrect = false;
                }
            });

            if (isCorrect) {
                showFeedback(true, "順序正確！");
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex >= currentQuestions.length) {
                        document.getElementById('completionModal').classList.remove('hidden');
                    } else {
                        updateProgress();
                        loadQuestion();
                    }
                }, 1500);
            } else {
                showFeedback(false, "順序有錯喔！再試試看");
            }
        }

        function showFeedback(isCorrect, message) {
            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');
            const modalBox = feedbackModal.querySelector('div');

            feedbackModal.classList.remove('hidden');
            modalBox.classList.remove('animate-shake', 'animate-popIn');
            void modalBox.offsetWidth;

            if (isCorrect) {
                modalBox.classList.add('animate-popIn');
                feedbackIcon.className = "text-[6rem] lg:text-[10rem] mb-4 text-green-500 font-sans animate-popIn";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feedbackText.className = "text-4xl lg:text-6xl font-black text-green-600 tracking-widest";
            } else {
                modalBox.classList.add('animate-shake');
                feedbackIcon.className = "text-[6rem] lg:text-[10rem] mb-4 text-red-500 font-sans";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                feedbackText.className = "text-4xl lg:text-6xl font-black text-red-600 tracking-widest";
            }
            feedbackText.textContent = message;

            setTimeout(() => {
                feedbackModal.classList.add('hidden');
            }, 1200);
        }
    </script>
</body>
</html>
