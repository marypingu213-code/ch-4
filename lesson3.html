<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三關：改錯字</title>
    <!-- 引入第三關專屬題庫 -->
    <script src="data_lesson3.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'BiaoKai', 'DFKai-SB', '楷體-繁', 'Kaiti TC', serif;
            background-color: #faf5ff; /* 淡紫色背景 */
            background-image: radial-gradient(#e9d5ff 3px, transparent 3px);
            background-size: 40px 40px;
            user-select: none; 
            overflow: hidden; /* 強制鎖死畫面 */
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 2.5s ease-in-out infinite; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* 單個字塊的樣式 */
        .char-tile {
            transition: all 0.2s ease;
        }
        .char-tile:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen text-gray-800 flex flex-col items-center justify-center p-4 lg:p-8">

    <div class="w-full h-full max-w-[1600px] max-h-[1200px] bg-white/95 backdrop-blur-sm p-6 sm:p-10 lg:p-14 rounded-[3rem] lg:rounded-[4rem] shadow-2xl relative border-4 lg:border-8 border-purple-200 flex flex-col">
        
        <a href="index.html" class="absolute top-5 left-5 lg:top-8 lg:left-8 text-gray-400 hover:text-purple-600 transition-colors text-xl lg:text-2xl font-bold flex items-center gap-2 no-underline z-10">
            <i class="fa-solid fa-arrow-left font-sans"></i> 回大廳
        </a>

        <!-- 標題與進度條 -->
        <div class="text-center mb-4 lg:mb-8 mt-10 lg:mt-4">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-purple-600 drop-shadow-sm flex items-center justify-center gap-4 tracking-widest">
                <i class="fa-solid fa-eraser text-purple-400 font-sans"></i>
                火眼金睛改錯字
            </h1>
            
            <div class="w-full max-w-3xl mx-auto bg-gray-200 rounded-full h-3 lg:h-5 mt-6 lg:mt-8 overflow-hidden shadow-inner">
                <div id="progressBar" class="bg-gradient-to-r from-purple-400 to-fuchsia-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-base lg:text-xl text-gray-400 font-bold mt-2 text-center font-sans">0 / 0</p>
        </div>

        <div class="flex-grow flex flex-col items-center w-full relative z-10 justify-evenly">
            
            <!-- 提示文字 -->
            <div id="instructionText" class="text-3xl lg:text-5xl text-purple-700 font-black mb-4 bg-purple-100 px-8 py-4 rounded-full shadow-sm animate-float tracking-widest">
                請點擊句子中的「錯字」！
            </div>

            <!-- 句子顯示區 (大字塊) -->
            <div id="sentenceArea" class="flex flex-wrap justify-center gap-2 lg:gap-4 p-4 lg:p-8 bg-purple-50/50 border-4 border-dashed border-purple-200 rounded-[2rem] w-full max-w-5xl">
                <!-- 字塊由 JS 生成 -->
            </div>

            <!-- 選項區 (預設隱藏) -->
            <div id="optionsArea" class="hidden w-full flex flex-col items-center gap-6 mt-4">
                <div class="text-2xl lg:text-4xl text-gray-600 font-bold border-b-4 border-fuchsia-200 pb-2 tracking-widest">
                    請問正確的字是哪一個？
                </div>
                <div id="choicesBox" class="flex justify-center gap-4 lg:gap-8">
                    <!-- 選項按鈕由 JS 生成 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 答對/答錯 回饋彈窗 -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden pointer-events-none">
        <div class="bg-white rounded-[2rem] lg:rounded-[3rem] p-10 lg:p-16 flex flex-col items-center shadow-2xl pointer-events-auto transition-transform">
            <div id="feedbackIcon" class="text-[6rem] lg:text-[10rem] mb-4"></div>
            <h2 id="feedbackText" class="text-4xl lg:text-6xl font-black tracking-widest"></h2>
        </div>
    </div>

    <!-- 恭喜過關彈窗 -->
    <div id="completionModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-[3rem] lg:rounded-[4rem] p-10 lg:p-20 flex flex-col items-center shadow-2xl border-[10px] border-purple-400 max-w-2xl text-center">
            <i class="fa-solid fa-crown text-[8rem] lg:text-[12rem] text-yellow-400 mb-6 animate-float font-sans"></i>
            <h2 class="text-5xl lg:text-7xl font-black text-purple-600 mb-4 drop-shadow-sm tracking-widest">太厲害了！</h2>
            <p class="text-2xl lg:text-3xl font-bold text-gray-600 mb-10">你已成功找出所有錯字！</p>
            <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-purple-500 to-fuchsia-500 text-white text-3xl lg:text-4xl font-black py-4 px-12 rounded-full shadow-xl hover:shadow-2xl hover:scale-105 transition-all tracking-widest">
                回到大廳
            </button>
        </div>
    </div>

    <script>
        if (typeof lessonData3 === 'undefined') {
            alert("題庫載入失敗！請確認 'data_lesson3.js' 檔案是否存在。");
        }

        let shuffledQuestions = [];
        let currentQuestionIndex = 0;
        let isWaitingForCorrection = false; 

        window.onload = () => {
            if (typeof lessonData3 !== 'undefined') {
                // 隨機打亂所有題目
                shuffledQuestions = [...lessonData3].sort(() => Math.random() - 0.5);
                initGame();
            }
        };

        function initGame() {
            updateProgress();
            loadQuestion();
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const percentage = (currentQuestionIndex / shuffledQuestions.length) * 100;
            progressBar.style.width = percentage + '%';
            progressText.innerText = (currentQuestionIndex + 1) + ' / ' + shuffledQuestions.length;
        }

        function loadQuestion() {
            isWaitingForCorrection = false;
            
            // 重置介面狀態
            document.getElementById('optionsArea').classList.add('hidden');
            const instructionText = document.getElementById('instructionText');
            instructionText.innerText = '請點擊句子中的「錯字」！';
            instructionText.className = "text-3xl lg:text-5xl text-purple-700 font-black mb-4 bg-purple-100 px-8 py-4 rounded-full shadow-sm animate-float tracking-widest";

            const sentenceArea = document.getElementById('sentenceArea');
            sentenceArea.innerHTML = '';

            const currentData = shuffledQuestions[currentQuestionIndex];
            
            // 將句子拆成單一字元並生成字塊
            const chars = currentData.sentence.split('');
            chars.forEach((char) => {
                const charBox = document.createElement('div');
                // 標點符號不做成按鈕，單純顯示文字
                const isPunctuation = /[\u3002\uff0c\uff1f\uff01\u3001\u3008\u3009\u300a\u300b\u300c\u300d\u300e\u300f\u2014\u2013\u2026\u2025\uFE30-\uFE4F]/.test(char);
                
                if (isPunctuation) {
                    charBox.className = "text-4xl sm:text-5xl lg:text-7xl font-bold text-gray-500 flex items-end pb-2";
                    charBox.innerText = char;
                } else {
                    charBox.className = "char-tile w-16 h-16 sm:w-20 sm:h-20 lg:w-28 lg:h-28 bg-white border-4 border-gray-300 rounded-xl lg:rounded-2xl shadow-sm flex items-center justify-center text-4xl sm:text-5xl lg:text-7xl font-bold text-gray-800 cursor-pointer hover:border-purple-400 hover:bg-purple-50 flex-shrink-0";
                    charBox.innerText = char;
                    charBox.onclick = () => handleCharClick(charBox, char, currentData.wrongChar);
                }
                
                sentenceArea.appendChild(charBox);
            });
        }

        function handleCharClick(element, clickedChar, wrongChar) {
            if (isWaitingForCorrection) return; // 如果已經在選正確的字了，就鎖定句子不給點

            if (clickedChar === wrongChar) {
                // 點對錯字了！
                isWaitingForCorrection = true;
                
                // 讓錯字變紅並加上明顯的外框
                element.classList.remove('border-gray-300', 'hover:border-purple-400', 'text-gray-800');
                element.classList.add('border-red-500', 'bg-red-100', 'text-red-600', 'animate-popIn');
                element.id = "targetWrongCharBox"; // 標記起來，等一下替換用

                // 更改提示並顯示選項
                const instructionText = document.getElementById('instructionText');
                instructionText.innerText = '答對了！請在下方選擇正確的字！';
                instructionText.classList.replace('text-purple-700', 'text-green-700');
                instructionText.classList.replace('bg-purple-100', 'bg-green-100');

                showOptions();
            } else {
                // 點錯了 (點到正確的字)
                element.classList.add('animate-shake', 'bg-gray-200');
                setTimeout(() => {
                    element.classList.remove('animate-shake', 'bg-gray-200');
                }, 400);
            }
        }

        function showOptions() {
            const optionsArea = document.getElementById('optionsArea');
            const choicesBox = document.getElementById('choicesBox');
            optionsArea.classList.remove('hidden');
            optionsArea.classList.add('animate-popIn');
            choicesBox.innerHTML = '';

            const currentData = shuffledQuestions[currentQuestionIndex];
            // 打亂選項順序
            let choices = [...currentData.choices].sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "w-20 h-20 sm:w-24 sm:h-24 lg:w-32 lg:h-32 bg-white border-4 border-fuchsia-300 text-fuchsia-700 text-4xl sm:text-5xl lg:text-7xl font-bold rounded-2xl shadow-md hover:bg-fuchsia-50 hover:border-fuchsia-500 hover:shadow-xl transition-all hover:-translate-y-2 flex items-center justify-center";
                btn.innerText = choice;
                btn.onclick = () => handleCorrectionSelect(choice, currentData.correctChar);
                choicesBox.appendChild(btn);
            });
        }

        function handleCorrectionSelect(selectedChar, correctChar) {
            if (selectedChar === correctChar) {
                // 選對正確的字了！
                const wrongBox = document.getElementById('targetWrongCharBox');
                // 視覺變更：替換文字，變綠色
                wrongBox.innerText = correctChar;
                wrongBox.classList.remove('border-red-500', 'bg-red-100', 'text-red-600');
                wrongBox.classList.add('border-green-500', 'bg-green-100', 'text-green-600', 'animate-popIn');

                showFeedback(true, "完全正確！");
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex >= shuffledQuestions.length) {
                        document.getElementById('completionModal').classList.remove('hidden');
                    } else {
                        loadQuestion();
                    }
                }, 1500);

            } else {
                // 選錯替換字
                showFeedback(false, "這個字不對喔！");
            }
        }

        function showFeedback(isCorrect, message) {
            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');
            const modalBox = feedbackModal.querySelector('div');

            feedbackModal.classList.remove('hidden');
            modalBox.classList.remove('animate-shake', 'animate-popIn');
            
            // 強制重啟動畫
            void modalBox.offsetWidth;

            if (isCorrect) {
                modalBox.classList.add('animate-popIn');
                feedbackIcon.className = "text-[6rem] lg:text-[10rem] mb-4 text-green-500 font-sans";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feedbackText.className = "text-4xl lg:text-6xl font-black text-green-600 tracking-widest";
            } else {
                modalBox.classList.add('animate-shake');
                feedbackIcon.className = "text-[6rem] lg:text-[10rem] mb-4 text-red-500 font-sans";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                feedbackText.className = "text-4xl lg:text-6xl font-black text-red-600 tracking-widest";
            }
            feedbackText.textContent = message;

            setTimeout(() => {
                feedbackModal.classList.add('hidden');
            }, 1200);
        }
    </script>
</body>
</html>
