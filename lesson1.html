<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一關：部件組合</title>
    <script src="data_lesson1.js?v=2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'BiaoKai', 'DFKai-SB', '楷體-繁', 'Kaiti TC', serif;
            background-color: #fdf4ff; 
            background-image: radial-gradient(#fbcfe8 3px, transparent 3px);
            background-size: 40px 40px;
            user-select: none; 
            overflow: hidden; 
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 2.5s ease-in-out infinite; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .draggable-piece.in-target {
            position: absolute !important;
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 20 !important;
        }

        .draggable-piece.is-dragging {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .draggable-piece img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important; 
            pointer-events: none !important;
        }
    </style>
</head>
<body class="h-screen w-screen text-gray-800 flex flex-col items-center justify-center p-2 lg:p-6">

    <div class="w-full h-full max-w-[1800px] max-h-[1200px] bg-white/95 backdrop-blur-sm p-4 sm:p-6 lg:p-10 rounded-[2rem] lg:rounded-[3rem] shadow-2xl relative border-4 lg:border-8 border-fuchsia-200 flex flex-col">
        
        <a href="index.html" class="absolute top-4 left-4 lg:top-6 lg:left-6 text-gray-400 hover:text-fuchsia-600 transition-colors text-xl lg:text-2xl font-bold flex items-center gap-2 no-underline z-20">
            <i class="fa-solid fa-arrow-left font-sans"></i> 回大廳
        </a>

        <div id="lessonSelectionScreen" class="flex-grow flex flex-col items-center justify-center w-full z-10 pb-8">
            <h1 class="text-5xl lg:text-7xl font-black text-fuchsia-500 mb-12 drop-shadow-sm flex items-center gap-4 tracking-widest">
                <i class="fa-solid fa-puzzle-piece text-fuchsia-300 font-sans"></i>
                請選擇課次
            </h1>
            
            <div id="lessonGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 lg:gap-10 w-full max-w-6xl px-6">
                </div>
        </div>

        <div id="gameScreen" class="hidden flex-grow flex-col items-center w-full relative z-10">
            
            <button onclick="backToSelection()" class="absolute top-0 right-2 lg:top-2 lg:right-2 bg-fuchsia-100 text-fuchsia-600 hover:bg-fuchsia-200 px-4 py-2 rounded-full font-bold text-lg lg:text-xl transition-colors z-30">
                <i class="fa-solid fa-rotate-left font-sans mr-1"></i> 重選課次
            </button>

            <div class="text-center w-full mb-4 lg:mb-6 mt-12 lg:mt-6">
                <h2 id="currentLessonTitle" class="text-2xl lg:text-4xl font-bold text-fuchsia-400 mb-4 tracking-widest">第一課</h2>
                <div class="w-full max-w-3xl mx-auto bg-gray-200 rounded-full h-3 lg:h-5 overflow-hidden shadow-inner">
                    <div id="progressBar" class="bg-gradient-to-r from-fuchsia-400 to-pink-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-base lg:text-xl text-gray-400 font-bold mt-2 text-center font-sans">0 / 0</p>
            </div>

            <div id="gameArea" class="flex-grow flex flex-col items-center justify-center w-full relative">
                
                <div id="assemblyStage" class="w-full flex flex-col lg:flex-row items-center justify-center gap-6 lg:gap-12 animate-popIn px-4">
                    
                    <div class="flex flex-col items-center w-full lg:w-1/2 max-w-xl border-[6px] border-red-400 bg-red-50/40 rounded-[2rem] p-6 lg:p-8 shadow-sm">
                        <p class="text-red-500 font-black mb-4 lg:mb-8 text-2xl lg:text-4xl drop-shadow-sm flex items-center gap-3 tracking-widest">
                            <i class="fa-solid fa-arrow-down font-sans"></i> 拖曳至此組合
                        </p>
                        
                        <div id="targetBox" class="relative bg-white w-[260px] h-[260px] sm:w-[360px] sm:h-[360px] lg:w-[480px] lg:h-[480px] rounded-2xl shadow-inner border-4 border-gray-400 transition-colors overflow-hidden">
                            <div class="absolute inset-0 pointer-events-none flex flex-col justify-center items-center z-0">
                                <div class="w-full h-[2px] bg-gray-300 border-dashed"></div>
                            </div>
                            <div class="absolute inset-0 pointer-events-none flex flex-row justify-center items-center z-0">
                                <div class="h-full w-[2px] bg-gray-300 border-dashed"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-center w-full lg:w-1/2 max-w-2xl border-[6px] border-blue-400 bg-blue-50/40 rounded-[2rem] p-6 lg:p-8 shadow-sm relative">
                        <p class="text-blue-500 font-black mb-4 lg:mb-8 text-2xl lg:text-4xl drop-shadow-sm flex items-center gap-3 tracking-widest">
                            <i class="fa-solid fa-hand-pointer animate-bounce font-sans"></i> 待選部件區
                        </p>
                        
                        <div id="optionsBox" class="flex flex-wrap justify-center gap-4 lg:gap-6 w-full min-h-[260px] content-start relative z-10">
                            </div>
                    </div>
                </div>

                <div id="actionArea" class="w-full flex justify-center mt-6 h-[60px]">
                    <button id="finishBtn" onclick="finishAssembly()" class="hidden bg-green-500 hover:bg-green-600 text-white text-2xl lg:text-4xl font-bold py-3 px-12 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 tracking-widest z-30 relative">
                        <i class="fa-solid fa-check mr-2 font-sans"></i> 我拼好了
                    </button>
                </div>

                <div id="radicalStage" class="w-full flex flex-col items-center hidden absolute inset-0 bg-white/95 z-20 justify-center pb-10">
                    <div class="text-[7rem] sm:text-[10rem] lg:text-[15rem] font-black text-gray-800 mb-4 lg:mb-8 drop-shadow-xl border-b-8 border-pink-200 pb-2 leading-none" id="completedWordDisplay">
                        字
                    </div>
                    
                    <h2 class="text-2xl sm:text-4xl lg:text-5xl font-black text-pink-600 mb-8 flex items-center gap-3 tracking-widest">
                        <i class="fa-solid fa-magnifying-glass font-sans"></i>
                        請問這個字的「部首」是什麼？
                    </h2>
                    
                    <div id="radicalOptionsBox" class="flex flex-wrap justify-center gap-4 lg:gap-8 w-full max-w-4xl">
                        </div>
                </div>

            </div>
        </div>
    </div>

    <div id="feedbackModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden pointer-events-none">
        <div class="bg-white rounded-[2rem] lg:rounded-[3rem] p-10 lg:p-16 flex flex-col items-center shadow-2xl animate-popIn pointer-events-auto">
            <div id="feedbackIcon" class="text-[6rem] lg:text-[10rem] mb-4"></div>
            <h2 id="feedbackText" class="text-4xl lg:text-6xl font-black tracking-widest"></h2>
        </div>
    </div>

    <div id="completionModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-[3rem] lg:rounded-[4rem] p-10 lg:p-20 flex flex-col items-center shadow-2xl animate-popIn border-[10px] border-fuchsia-400 max-w-2xl text-center">
            <i class="fa-solid fa-trophy text-[8rem] lg:text-[12rem] text-yellow-400 mb-6 animate-float font-sans"></i>
            <h2 class="text-5xl lg:text-7xl font-black text-fuchsia-600 mb-4 drop-shadow-sm tracking-widest">恭喜過關！</h2>
            <p class="text-2xl lg:text-3xl font-bold text-gray-600 mb-10">你已完成本課所有生字！</p>
            <div class="flex gap-4 justify-center">
                <button onclick="backToSelection()" class="bg-fuchsia-100 text-fuchsia-600 border-4 border-fuchsia-300 text-2xl lg:text-3xl font-black py-4 px-8 rounded-full shadow-lg hover:scale-105 transition-all tracking-widest">
                    選其他課
                </button>
                <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-fuchsia-500 to-pink-500 text-white text-2xl lg:text-3xl font-black py-4 px-8 rounded-full shadow-lg hover:scale-105 transition-all tracking-widest">
                    回大廳
                </button>
            </div>
        </div>
    </div>

    <script>
        if (typeof lessonData === 'undefined') {
            alert("題庫載入失敗！請確認 'data_lesson1.js' 檔案是否正確且包含課次分類格式。");
        }

        let currentLessonKey = "";
        let currentQuestions = [];
        let currentWordIndex = 0;

        window.onload = () => {
            if (typeof lessonData !== 'undefined') {
                renderLessonSelection();
            }
        };

        // 產生 1~12 課的按鈕
        function renderLessonSelection() {
            const lessonGrid = document.getElementById('lessonGrid');
            lessonGrid.innerHTML = '';
            
            for (let i = 1; i <= 12; i++) {
                const lessonKey = `lesson${i}`;
                // 檢查該課次是否存在且有題目
                const hasQuestions = lessonData[lessonKey] && lessonData[lessonKey].length > 0;
                
                const btn = document.createElement('button');
                
                if (hasQuestions) {
                    // ★ 修正按鈕外觀：加高 py-8 lg:py-12，字體放大
                    btn.className = "bg-white border-4 border-fuchsia-300 text-fuchsia-600 text-3xl lg:text-5xl font-black py-8 lg:py-12 rounded-2xl lg:rounded-[2.5rem] shadow-lg hover:bg-fuchsia-50 hover:shadow-2xl transition-transform hover:-translate-y-2 tracking-widest";
                    btn.innerText = `第 ${i} 課`;
                    btn.onclick = () => startLesson(lessonKey, i);
                } else {
                    // 灰色不可點擊狀態
                    btn.className = "bg-gray-100 border-4 border-gray-200 text-gray-400 text-3xl lg:text-5xl font-black py-8 lg:py-12 rounded-2xl lg:rounded-[2.5rem] shadow-sm cursor-not-allowed tracking-widest relative overflow-hidden";
                    btn.innerHTML = `第 ${i} 課 <span class="absolute text-sm bg-gray-300 text-white px-3 py-1 rounded-full bottom-3 right-3 font-sans shadow-inner">無題目</span>`;
                }
                
                lessonGrid.appendChild(btn);
            }
        }

        function startLesson(lessonKey, lessonNumber) {
            currentLessonKey = lessonKey;
            currentQuestions = [...lessonData[lessonKey]];
            currentWordIndex = 0;

            document.getElementById('currentLessonTitle').innerText = `第 ${lessonNumber} 課`;
            
            document.getElementById('lessonSelectionScreen').classList.add('hidden');
            document.getElementById('lessonSelectionScreen').classList.remove('flex');
            
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex', 'animate-popIn');
            
            document.getElementById('completionModal').classList.add('hidden');

            updateProgress();
            loadWord();
        }

        function backToSelection() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('flex');
            
            const selectionScreen = document.getElementById('lessonSelectionScreen');
            selectionScreen.classList.remove('hidden');
            selectionScreen.classList.add('flex', 'animate-popIn');
            
            document.getElementById('completionModal').classList.add('hidden');
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const percentage = (currentWordIndex / currentQuestions.length) * 100;
            progressBar.style.width = percentage + '%';
            progressText.innerText = (currentWordIndex + 1) + ' / ' + currentQuestions.length;
        }

        const renderPieceContent = (content) => {
            const lowerContent = content.toLowerCase();
            if (lowerContent.endsWith('.png') || lowerContent.endsWith('.jpg') || lowerContent.endsWith('.jpeg')) {
                return `<img src="${content}" alt="部件" onerror='this.outerHTML="<div class=\\"text-xs lg:text-sm text-red-500 font-bold break-all p-1 leading-tight flex items-center justify-center text-center w-full h-full font-sans\\">找不到圖片:<br>${content}</div>"'>`;
            } else {
                return content;
            }
        };

        function loadWord() {
            document.getElementById('assemblyStage').classList.remove('hidden');
            document.getElementById('assemblyStage').classList.add('flex');
            document.getElementById('radicalStage').classList.add('hidden');
            document.getElementById('radicalStage').classList.remove('flex');
            document.getElementById('finishBtn').classList.add('hidden');
            
            document.getElementById('targetBox').innerHTML = `
                <div class="absolute inset-0 pointer-events-none flex flex-col justify-center items-center z-0">
                    <div class="w-full h-[2px] bg-gray-300 border-dashed"></div>
                </div>
                <div class="absolute inset-0 pointer-events-none flex flex-row justify-center items-center z-0">
                    <div class="h-full w-[2px] bg-gray-300 border-dashed"></div>
                </div>
            `; 
            
            const currentData = currentQuestions[currentWordIndex];
            let currentOptions = [...currentData.components];
            currentOptions.sort(() => Math.random() - 0.5);

            const optionsBox = document.getElementById('optionsBox');
            optionsBox.innerHTML = '';

            currentOptions.forEach((comp) => {
                const pieceDiv = document.createElement('div');
                const isImage = comp.toLowerCase().endsWith('.png') || comp.toLowerCase().endsWith('.jpg');
                const paddingClass = isImage ? 'p-1 lg:p-3' : 'p-3 lg:p-6';

                pieceDiv.className = `draggable-piece touch-none w-40 h-40 sm:w-48 sm:h-48 lg:w-56 lg:h-56 bg-white border-4 border-gray-200 rounded-2xl lg:rounded-3xl shadow-md hover:shadow-xl hover:border-blue-400 cursor-grab active:cursor-grabbing flex items-center justify-center text-4xl lg:text-7xl font-bold text-gray-700 z-10 ${paddingClass} relative`;
                
                pieceDiv.innerHTML = renderPieceContent(comp);
                pieceDiv.dataset.compContent = comp; 
                
                pieceDiv.addEventListener('pointerdown', onPointerDown);
                optionsBox.appendChild(pieceDiv);
            });
        }

        let draggedPiece = null;
        let shiftX = 0;
        let shiftY = 0;
        let placeholder = null;

        function onPointerDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault(); 
            
            draggedPiece = e.currentTarget;
            draggedPiece.classList.add('is-dragging');
            
            const rect = draggedPiece.getBoundingClientRect();
            shiftX = e.clientX - rect.left;
            shiftY = e.clientY - rect.top;
            
            placeholder = document.createElement('div');
            placeholder.className = draggedPiece.className;
            placeholder.classList.remove('is-dragging', 'in-target');
            placeholder.style.visibility = 'hidden';
            draggedPiece.parentNode.insertBefore(placeholder, draggedPiece);
            
            document.body.appendChild(draggedPiece);
            
            draggedPiece.style.position = 'fixed';
            draggedPiece.style.zIndex = '9999';
            draggedPiece.style.pointerEvents = 'none';
            
            moveAt(e.clientX, e.clientY);
        }

        function onPointerMove(e) {
            if (!draggedPiece) return;
            e.preventDefault(); 
            moveAt(e.clientX, e.clientY);
        }

        function moveAt(pageX, pageY) {
            draggedPiece.style.left = pageX - shiftX + 'px';
            draggedPiece.style.top = pageY - shiftY + 'px';
        }

        function onPointerUp(e) {
            if (!draggedPiece) return;
            
            draggedPiece.style.display = 'none';
            const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            draggedPiece.style.display = '';
            
            draggedPiece.classList.remove('is-dragging');
            draggedPiece.style.position = '';
            draggedPiece.style.left = '';
            draggedPiece.style.top = '';
            draggedPiece.style.zIndex = '';
            draggedPiece.style.pointerEvents = 'auto'; 
            
            const targetBox = document.getElementById('targetBox');
            const optionsBox = document.getElementById('optionsBox');
            
            if (elemBelow && (elemBelow === targetBox || targetBox.contains(elemBelow))) {
                targetBox.appendChild(draggedPiece);
                draggedPiece.classList.add('in-target');
                
                const boxRect = targetBox.getBoundingClientRect();
                let newLeft = e.clientX - boxRect.left - shiftX;
                let newTop = e.clientY - boxRect.top - shiftY;
                
                draggedPiece.style.left = newLeft + 'px';
                draggedPiece.style.top = newTop + 'px';
                
            } else {
                optionsBox.appendChild(draggedPiece);
                draggedPiece.classList.remove('in-target');
            }
            
            if (placeholder && placeholder.parentNode) {
                placeholder.parentNode.removeChild(placeholder);
            }
            
            draggedPiece = null;
            placeholder = null;
            
            checkAssemblyState();
        }

        document.addEventListener('pointermove', onPointerMove, { passive: false });
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerUp);

        function checkAssemblyState() {
            const currentData = currentQuestions[currentWordIndex];
            const targetBox = document.getElementById('targetBox');
            const finishBtn = document.getElementById('finishBtn');
            
            const piecesInTarget = Array.from(targetBox.children).filter(el => el.dataset.compContent);
            
            if (piecesInTarget.length === currentData.components.length) {
                finishBtn.classList.remove('hidden');
                finishBtn.classList.add('animate-popIn');
            } else {
                finishBtn.classList.add('hidden');
                finishBtn.classList.remove('animate-popIn');
            }
        }

        function finishAssembly() {
            const targetBox = document.getElementById('targetBox');
            
            targetBox.classList.replace('border-gray-400', 'border-green-400');
            targetBox.classList.add('bg-green-100');
            showFeedback(true, "組裝完成！");
            
            setTimeout(() => {
                targetBox.classList.replace('border-green-400', 'border-gray-400');
                targetBox.classList.remove('bg-green-100');
                showRadicalSelection();
            }, 800);
        }

        function showRadicalSelection() {
            document.getElementById('assemblyStage').classList.add('hidden');
            document.getElementById('assemblyStage').classList.remove('flex');
            document.getElementById('finishBtn').classList.add('hidden');
            
            const radicalStage = document.getElementById('radicalStage');
            radicalStage.classList.remove('hidden');
            radicalStage.classList.add('flex', 'animate-popIn');
            
            const currentData = currentQuestions[currentWordIndex];
            document.getElementById('completedWordDisplay').innerText = currentData.char;
            
            const radicalOptionsBox = document.getElementById('radicalOptionsBox');
            radicalOptionsBox.innerHTML = '';
            
            let choices = [...currentData.radicalChoices];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "group relative bg-white border-4 border-pink-200 text-pink-700 text-3xl sm:text-4xl lg:text-6xl font-bold w-20 h-20 sm:w-28 sm:h-28 lg:w-40 lg:h-40 rounded-2xl lg:rounded-3xl shadow-md hover:bg-pink-50 hover:border-pink-400 hover:shadow-xl transition-all hover:-translate-y-2 flex items-center justify-center overflow-hidden";
                
                btn.innerHTML = `<span class="relative z-10 pointer-events-none">${choice}</span>`;
                btn.onclick = () => selectRadical(choice);
                radicalOptionsBox.appendChild(btn);
            });
        }

        function selectRadical(choice) {
            const currentData = currentQuestions[currentWordIndex];
            if (choice === currentData.radical) {
                showFeedback(true, "正確");
                setTimeout(nextWord, 800);
            } else {
                showFeedback(false, "錯誤");
            }
        }

        function nextWord() {
            currentWordIndex++;
            if (currentWordIndex >= currentQuestions.length) {
                document.getElementById('completionModal').classList.remove('hidden');
            } else {
                updateProgress();
                loadWord();
            }
        }

        function showFeedback(isCorrect, message) {
            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');

            feedbackModal.classList.remove('hidden');
            
            if (isCorrect) {
                feedbackIcon.className = "text-[6rem] lg:text-[10rem] mb-4 text-green-500 font-sans";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feedbackText.className = "text-4xl lg:text-6xl font-black text-green-600 tracking-widest";
            } else {
                feedbackIcon.className = "text-[6rem] lg:text-[10rem] mb-4 text-red-500 animate-shake font-sans";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                feedbackText.className = "text-4xl lg:text-6xl font-black text-red-600 tracking-widest";
            }
            feedbackText.textContent = message;

            setTimeout(() => {
                feedbackModal.classList.add('hidden');
            }, 800);
        }
    </script>
</body>
</html>
