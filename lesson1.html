<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一關：部件組合</title>
    <!-- 引入 Tailwind CSS 進行排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf4ff;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none;
        }

        /* 浮動動畫 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float { animation: float 2.5s ease-in-out infinite; }
        
        /* 震動動畫 (錯誤時使用) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        /* 放大彈出動畫 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-white/95 backdrop-blur-sm p-6 md:p-8 rounded-[2rem] shadow-xl relative border-4 border-fuchsia-200">
        
        <!-- 返回大廳按鈕 -->
        <a href="index.html" class="absolute top-6 left-6 text-gray-400 hover:text-fuchsia-600 transition-colors text-xl font-bold flex items-center gap-2 no-underline">
            <i class="fa-solid fa-arrow-left"></i> 回大廳
        </a>

        <!-- 關卡標題 -->
        <div class="text-center mb-8 mt-4">
            <h1 class="text-3xl md:text-4xl font-black text-fuchsia-600 drop-shadow-sm flex items-center justify-center gap-3">
                <i class="fa-solid fa-puzzle-piece text-fuchsia-400"></i>
                第一關：部件組合
            </h1>
            <p class="text-gray-500 font-bold mt-2 text-lg">請將下方的部件，組合成正確的國字！</p>
            
            <!-- 進度條 -->
            <div class="w-full bg-gray-200 rounded-full h-3 mt-4 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-fuchsia-400 to-pink-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm text-gray-400 font-bold mt-1 text-right">0 / 4</p>
        </div>

        <!-- 遊戲主體區域 -->
        <div id="gameArea" class="flex flex-col items-center">
            
            <!-- 階段一：部件組合 -->
            <div id="assemblyStage" class="w-full flex flex-col items-center animate-popIn">
                <!-- 目標組合框 (放置選取的部件) -->
                <div class="w-full max-w-md bg-fuchsia-50 border-4 border-dashed border-fuchsia-300 rounded-2xl p-6 mb-8 min-h-[160px] flex items-center justify-center gap-2 flex-wrap transition-colors duration-300" id="targetBox">
                    <!-- 選取的部件會出現在這裡 -->
                </div>
                
                <p class="text-gray-500 font-bold mb-3"><i class="fa-solid fa-hand-pointer text-pink-400"></i> 請點擊下方部件：</p>
                
                <!-- 可選部件區 -->
                <div id="optionsBox" class="flex flex-wrap justify-center gap-4 w-full">
                    <!-- 部件選項由 JS 生成 -->
                </div>
            </div>

            <!-- 階段二：選擇部首 (預設隱藏) -->
            <div id="radicalStage" class="w-full flex flex-col items-center hidden">
                <div class="text-8xl md:text-9xl font-black text-gray-800 mb-8 drop-shadow-md border-b-4 border-pink-200 pb-4" id="completedWordDisplay">
                    字
                </div>
                
                <h2 class="text-2xl font-black text-pink-600 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    請問這個字的「部首」是什麼？
                </h2>
                
                <!-- 部首選項區 -->
                <div id="radicalOptionsBox" class="flex flex-wrap justify-center gap-4 w-full">
                    <!-- 部首選項由 JS 生成 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 答對/答錯 回饋彈窗 (預設隱藏) -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-3xl p-8 flex flex-col items-center shadow-2xl animate-popIn">
            <div id="feedbackIcon" class="text-7xl mb-4"></div>
            <h2 id="feedbackText" class="text-3xl font-black"></h2>
        </div>
    </div>

    <!-- 恭喜過關彈窗 (預設隱藏) -->
    <div id="completionModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-[3rem] p-10 flex flex-col items-center shadow-2xl animate-popIn border-8 border-pink-400 max-w-sm text-center">
            <i class="fa-solid fa-trophy text-8xl text-yellow-400 mb-6 animate-float"></i>
            <h2 class="text-4xl font-black text-pink-600 mb-4">恭喜過關！</h2>
            <p class="text-xl font-bold text-gray-600 mb-8">你已經完成此關卡！</p>
            <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white text-2xl font-black py-4 px-10 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all">
                回到大廳
            </button>
        </div>
    </div>

    <script>
        /* 
         * STREAMING_CHUNK:設定遊戲字庫與圖片路徑... 
         * ==========================================
         * 第一關專屬：遊戲資料設定 (Dictionary)
         * ==========================================
         * 老師請注意：如果是有圖片的部件，請直接填寫圖片的「相對路徑」。
         * 程式會自動判斷結尾是否有 .png 或 .jpg 來決定要顯示圖片還是純文字。
         */
        const lessonData = [
            {
                char: "依",
                // 這裡示範使用圖片路徑 (請確保資料夾與檔名拼字大小寫完全相符)
                components: ["lesson1/L1/筆順-依-部件-1.png", "lesson1/L1/筆順-依-部件-2.png"], 
                radical: "人",
                radicalChoices: ["人", "衣", "口", "木"]
            },
            {
                char: "姐",
                // 若沒有圖片，直接寫文字也是可以運作的！會顯示為大字體
                components: ["女", "且"], 
                radical: "女",
                radicalChoices: ["月", "女", "一", "目"]
            },
            {
                char: "招",
                components: ["扌", "刀", "口"], 
                radical: "手",
                radicalChoices: ["手", "刀", "口", "人"]
            },
            {
                char: "則",
                components: ["貝", "刂"], 
                radical: "刀",
                radicalChoices: ["貝", "刀", "人", "木"]
            }
        ];

        let currentWordIndex = 0;
        let selectedPieces = []; // 存放玩家目前點選的部件
        let currentOptions = []; // 存放目前打亂後的部件選項

        // 頁面載入後初始化
        window.onload = () => {
            initGame();
        };

        function initGame() {
            currentWordIndex = 0;
            updateProgress();
            loadWord();
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const percentage = (currentWordIndex / lessonData.length) * 100;
            progressBar.style.width = percentage + '%';
            progressText.innerText = currentWordIndex + ' / ' + lessonData.length;
        }

        /* 
         * STREAMING_CHUNK:核心判斷：渲染圖片或文字... 
         * 這個函數非常重要！它會判斷內容是不是圖片結尾。
         */
        const renderPieceContent = (content) => {
            const lowerContent = content.toLowerCase();
            if (lowerContent.endsWith('.png') || lowerContent.endsWith('.jpg') || lowerContent.endsWith('.jpeg')) {
                // 如果是圖片路徑，就產生 <img> 標籤
                return `<img src="${content}" alt="部件" class="max-w-full max-h-full object-contain drop-shadow-sm pointer-events-none">`;
            } else {
                // 否則顯示為純文字
                return content;
            }
        };

        function loadWord() {
            selectedPieces = [];
            document.getElementById('assemblyStage').classList.remove('hidden');
            document.getElementById('radicalStage').classList.add('hidden');
            document.getElementById('targetBox').innerHTML = ''; // 清空目標框
            
            const currentData = lessonData[currentWordIndex];
            
            // 複製一份部件陣列並打亂順序
            currentOptions = [...currentData.components];
            currentOptions.sort(() => Math.random() - 0.5);

            const optionsBox = document.getElementById('optionsBox');
            optionsBox.innerHTML = '';

            // 產生可選部件的按鈕
            currentOptions.forEach((comp, index) => {
                const pieceDiv = document.createElement('div');
                // 根據內容是圖片還是文字，設定不同的 padding
                const isImage = comp.toLowerCase().endsWith('.png') || comp.toLowerCase().endsWith('.jpg');
                const paddingClass = isImage ? 'p-1' : 'p-4';

                pieceDiv.className = `w-20 h-20 md:w-24 md:h-24 bg-white border-2 border-gray-200 rounded-xl shadow-sm hover:shadow-md cursor-pointer hover:-translate-y-1 transition-all flex items-center justify-center text-4xl font-bold text-gray-700 ${paddingClass}`;
                
                pieceDiv.innerHTML = renderPieceContent(comp);
                
                pieceDiv.onclick = () => selectPiece(index, pieceDiv, comp);
                optionsBox.appendChild(pieceDiv);
            });
        }

        function selectPiece(index, element, compContent) {
            // 隱藏原本的選項 (假裝移動)
            element.style.visibility = 'hidden';
            
            // 加入已選清單
            selectedPieces.push(compContent);
            
            // 在目標框產生新的元素
            const targetBox = document.getElementById('targetBox');
            const newPiece = document.createElement('div');
            
            const isImage = compContent.toLowerCase().endsWith('.png') || compContent.toLowerCase().endsWith('.jpg');
            const paddingClass = isImage ? 'p-1' : 'p-4';

            newPiece.className = `w-16 h-16 md:w-20 md:h-20 bg-white border-2 border-fuchsia-400 rounded-xl shadow-sm flex items-center justify-center text-3xl font-bold text-gray-700 cursor-pointer animate-popIn ${paddingClass}`;
            newPiece.innerHTML = renderPieceContent(compContent);
            
            // 點擊可以退回部件
            newPiece.onclick = () => returnPiece(index, newPiece, compContent);
            
            targetBox.appendChild(newPiece);

            // 檢查是否選滿了部件
            const currentData = lessonData[currentWordIndex];
            if (selectedPieces.length === currentData.components.length) {
                setTimeout(checkAssembly, 300); // 稍微延遲讓動畫跑完
            }
        }

        function returnPiece(originalIndex, targetElement, compContent) {
            // 從已選陣列中移除
            const removeIndex = selectedPieces.indexOf(compContent);
            if (removeIndex > -1) {
                selectedPieces.splice(removeIndex, 1);
            }
            
            // 移除目標框中的元素
            targetElement.remove();
            
            // 恢復原本選項區的元素顯示
            const optionsBox = document.getElementById('optionsBox');
            optionsBox.children[originalIndex].style.visibility = 'visible';
        }

        function checkAssembly() {
            const currentData = lessonData[currentWordIndex];
            const targetBox = document.getElementById('targetBox');
            
            // 檢查陣列內容是否完全一致 (不考慮順序)
            const sortedSelected = [...selectedPieces].sort();
            const sortedTarget = [...currentData.components].sort();
            
            const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedTarget);

            if (isCorrect) {
                targetBox.classList.replace('border-fuchsia-300', 'border-green-400');
                targetBox.classList.add('bg-green-50');
                showFeedback(true, "正確！");
                
                // 1秒後進入部首選擇
                setTimeout(() => {
                    targetBox.classList.replace('border-green-400', 'border-fuchsia-300');
                    targetBox.classList.remove('bg-green-50');
                    showRadicalSelection();
                }, 1000);

            } else {
                targetBox.classList.add('animate-shake', 'border-red-400', 'bg-red-50');
                showFeedback(false, "錯誤！");
                
                // 錯誤則重置
                setTimeout(() => {
                    targetBox.classList.remove('animate-shake', 'border-red-400', 'bg-red-50');
                    loadWord(); 
                }, 1000);
            }
        }

        function showRadicalSelection() {
            document.getElementById('assemblyStage').classList.add('hidden');
            const radicalStage = document.getElementById('radicalStage');
            radicalStage.classList.remove('hidden');
            radicalStage.classList.add('animate-popIn');
            
            const currentData = lessonData[currentWordIndex];
            
            // 顯示組合好的中文字
            document.getElementById('completedWordDisplay').innerText = currentData.char;
            
            const radicalOptionsBox = document.getElementById('radicalOptionsBox');
            radicalOptionsBox.innerHTML = '';
            
            // 產生部首按鈕 (預設已在資料中寫好選項)
            let choices = [...currentData.radicalChoices];
            choices.sort(() => Math.random() - 0.5); // 打亂部首選項

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "group relative bg-white border-2 border-pink-200 text-pink-700 text-3xl font-bold w-20 h-20 md:w-24 md:h-24 rounded-2xl shadow-sm hover:bg-pink-50 hover:border-pink-400 hover:shadow-md transition-all hover:-translate-y-1 flex items-center justify-center overflow-hidden";
                
                btn.innerHTML = `<span class="relative z-10">${choice}</span>`;
                btn.onclick = () => selectRadical(choice);
                radicalOptionsBox.appendChild(btn);
            });
        }

        function selectRadical(choice) {
            const currentData = lessonData[currentWordIndex];
            if (choice === currentData.radical) {
                showFeedback(true, "正確！");
                setTimeout(nextWord, 1000);
            } else {
                showFeedback(false, "錯誤！");
                // 這裡可以選擇不重置，讓學生繼續猜部首
            }
        }

        function nextWord() {
            currentWordIndex++;
            updateProgress();
            
            if (currentWordIndex >= lessonData.length) {
                // 遊戲結束
                document.getElementById('completionModal').classList.remove('hidden');
            } else {
                loadWord();
            }
        }

        function showFeedback(isCorrect, message) {
            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');

            feedbackModal.classList.remove('hidden');
            
            if (isCorrect) {
                feedbackIcon.className = "text-7xl mb-4 text-green-500";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feedbackText.className = "text-3xl font-black text-green-600";
            } else {
                feedbackIcon.className = "text-7xl mb-4 text-red-500 animate-shake";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                feedbackText.className = "text-3xl font-black text-red-600";
            }
            feedbackText.textContent = message;

            // 0.8秒後自動隱藏，讓節奏更輕快
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
            }, 800);
        }
    </script>
</body>
</html>
