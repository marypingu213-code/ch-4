<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一關：部件組合</title>
    <!-- 引入 Tailwind CSS 進行排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf4ff; 
            background-image: radial-gradient(#fbcfe8 3px, transparent 3px);
            background-size: 40px 40px;
            user-select: none; 
            overflow-x: hidden; 
        }

        /* 動畫效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 2.5s ease-in-out infinite; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* 拖曳中與放入田字格後的部件樣式：無白底、無邊框、背景透明 */
        .draggable-piece.is-dragging,
        .draggable-piece.in-target {
            position: absolute !important;
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 50 !important;
        }

        /* 拖曳中給予輕微圖片陰影提升對比，但不擋住底層 */
        .draggable-piece.is-dragging {
            z-index: 9999 !important;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.25));
        }

        /* 確保部件圖片維持原比例並填滿容器 */
        .draggable-piece img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important; 
            pointer-events: none !important;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center justify-center p-3 sm:p-5 lg:p-8">

    <div class="w-full max-w-[1700px] flex-grow bg-white/95 backdrop-blur-sm p-4 sm:p-6 lg:p-10 rounded-[2rem] lg:rounded-[3rem] shadow-2xl relative border-4 lg:border-8 border-fuchsia-200 flex flex-col justify-between">
        
        <!-- 返回大廳按鈕 -->
        <a href="index.html" class="absolute top-4 left-4 lg:top-7 lg:left-7 text-gray-400 hover:text-fuchsia-600 transition-colors text-lg lg:text-2xl font-bold flex items-center gap-2 no-underline z-10">
            <i class="fa-solid fa-arrow-left"></i> 回大廳
        </a>

        <!-- 關卡標題與進度 -->
        <div class="text-center mb-4 lg:mb-6 mt-8 lg:mt-2">
            <h1 class="text-2xl sm:text-4xl lg:text-5xl font-black text-fuchsia-600 drop-shadow-sm flex items-center justify-center gap-3">
                <i class="fa-solid fa-puzzle-piece text-fuchsia-400"></i>
                部件組合大挑戰
            </h1>
            <p class="text-gray-500 font-bold mt-2 text-base lg:text-xl">請將右側待選部件拖曳至左側田字格，組合出正確國字！</p>
            
            <div class="w-full max-w-2xl mx-auto bg-gray-200 rounded-full h-3 lg:h-4 mt-4 overflow-hidden shadow-inner">
                <div id="progressBar" class="bg-gradient-to-r from-fuchsia-400 to-pink-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm lg:text-lg text-gray-400 font-bold mt-1 text-center">0 / 0</p>
        </div>

        <div id="gameArea" class="flex-grow flex flex-col items-center justify-center w-full relative">
            
            <!-- 階段一：部件組合 -->
            <div id="assemblyStage" class="w-full flex flex-col lg:flex-row items-center justify-center gap-6 lg:gap-10 animate-popIn px-2">
                
                <!-- 左側：放大版田字格目標區 -->
                <div class="flex flex-col items-center w-full lg:w-1/2 max-w-2xl border-[6px] border-red-400 bg-red-50/40 rounded-[2rem] p-4 lg:p-6 shadow-sm">
                    <p class="text-red-500 font-black mb-3 lg:mb-5 text-xl lg:text-3xl drop-shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-arrow-down"></i> 拖曳至此組合
                    </p>
                    
                    <!-- 放大田字格容器 (最大 520px x 520px) -->
                    <div id="targetBox" class="relative bg-white w-[300px] h-[300px] sm:w-[420px] sm:h-[420px] lg:w-[520px] lg:h-[520px] rounded-2xl shadow-inner border-4 border-gray-400 transition-colors overflow-hidden">
                        <!-- 十字格線 -->
                        <div class="absolute inset-0 pointer-events-none flex flex-col justify-center items-center z-0">
                            <div class="w-full h-[2px] bg-gray-300 border-dashed"></div>
                        </div>
                        <div class="absolute inset-0 pointer-events-none flex flex-row justify-center items-center z-0">
                            <div class="h-full w-[2px] bg-gray-300 border-dashed"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 右側：待選部件區 -->
                <div class="flex flex-col items-center w-full lg:w-1/2 max-w-2xl border-[6px] border-blue-400 bg-blue-50/40 rounded-[2rem] p-4 lg:p-6 shadow-sm relative min-h-[360px] lg:min-h-[580px]">
                    <p class="text-blue-500 font-black mb-4 lg:mb-6 text-xl lg:text-3xl drop-shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-hand-pointer animate-bounce"></i> 待選部件區
                    </p>
                    
                    <div id="optionsBox" class="flex flex-wrap justify-center items-center gap-4 lg:gap-6 w-full min-h-[260px] content-start relative z-10">
                        <!-- 部件卡片由 JS 動態生成 -->
                    </div>
                </div>
            </div>

            <div id="actionArea" class="w-full flex justify-center mt-6 h-[60px]">
                <button id="finishBtn" onclick="finishAssembly()" class="hidden bg-green-500 hover:bg-green-600 text-white text-xl lg:text-3xl font-bold py-3 px-10 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-check mr-2"></i> 我拼好了
                </button>
            </div>

            <div id="radicalStage" class="w-full flex flex-col items-center hidden absolute top-0 w-full h-full bg-white/95 z-30">
                <div class="text-[7rem] sm:text-[10rem] lg:text-[14rem] font-black text-gray-800 mb-4 lg:mb-8 drop-shadow-xl border-b-8 border-pink-200 pb-2 leading-none mt-6" id="completedWordDisplay">
                    字
                </div>
                
                <h2 class="text-2xl sm:text-3xl lg:text-5xl font-black text-pink-600 mb-6 flex items-center gap-3">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    請問這個字的「部首」是什麼？
                </h2>
                
                <div id="radicalOptionsBox" class="flex flex-wrap justify-center gap-4 lg:gap-8 w-full max-w-4xl">
                    <!-- 部首按鈕由 JS 生成 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 答對/答錯 回饋彈窗 -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden pointer-events-none">
        <div class="bg-white rounded-[2rem] lg:rounded-[3rem] p-8 lg:p-14 flex flex-col items-center shadow-2xl animate-popIn pointer-events-auto">
            <div id="feedbackIcon" class="text-[5rem] lg:text-[8rem] mb-2"></div>
            <h2 id="feedbackText" class="text-3xl lg:text-5xl font-black"></h2>
        </div>
    </div>

    <!-- 恭喜過關彈窗 -->
    <div id="completionModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-[3rem] lg:rounded-[4rem] p-8 lg:p-16 flex flex-col items-center shadow-2xl animate-popIn border-[10px] border-pink-400 max-w-2xl text-center">
            <i class="fa-solid fa-trophy text-[7rem] lg:text-[10rem] text-yellow-400 mb-4 animate-float"></i>
            <h2 class="text-4xl lg:text-6xl font-black text-pink-600 mb-3 drop-shadow-sm">恭喜過關！</h2>
            <p class="text-xl lg:text-2xl font-bold text-gray-600 mb-8">你已經完成此關卡！</p>
            <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white text-2xl lg:text-3xl font-black py-4 px-10 rounded-full shadow-xl hover:shadow-2xl hover:scale-105 transition-all">
                回到大廳
            </button>
        </div>
    </div>

    <script>
        const lessonData = [
            // 第一課
            { char: "串", components: ["lesson1/L1/筆順-串-部件-1.png", "lesson1/L1/筆順-串-部件-2.png", "lesson1/L1/筆順-串-部件-3.png"], radical: "丨", radicalChoices: ["丨", "口", "人", "木"] },
            { char: "泳", components: ["lesson1/L1/筆順-泳-部件-1.png", "lesson1/L1/筆順-泳-部件-2.png"], radical: "水", radicalChoices: ["水", "木", "人", "日"] },
            { char: "陀", components: ["lesson1/L1/筆順-陀-部件-1.png", "lesson1/L1/筆順-陀-部件-2.png"], radical: "阜", radicalChoices: ["阜", "宀", "匕", "手"] },
            { char: "姿", components: ["lesson1/L1/筆順-姿-部件-1.png", "lesson1/L1/筆順-姿-部件-2.png", "lesson1/L1/筆順-姿-部件-3.png"], radical: "女", radicalChoices: ["女", "欠", "次", "人"] },
            { char: "般", components: ["lesson1/L1/筆順-般-部件-1.png", "lesson1/L1/筆順-般-部件-2.png", "lesson1/L1/筆順-般-部件-3.png"], radical: "舟", radicalChoices: ["舟", "几", "又", "水"] },
            { char: "溜", components: ["lesson1/L1/筆順-溜-部件-1.png", "lesson1/L1/筆順-溜-部件-2.png", "lesson1/L1/筆順-溜-部件-3.png", "lesson1/L1/筆順-溜-部件-4.png"], radical: "水", radicalChoices: ["水", "刀", "田", "木"] },
            { char: "滑", components: ["lesson1/L1/筆順-滑-部件-1.png", "lesson1/L1/筆順-滑-部件-2.png", "lesson1/L1/筆順-滑-部件-3.png"], radical: "水", radicalChoices: ["水", "月", "骨", "手"] },
            { char: "煩", components: ["lesson1/L1/筆順-煩-部件-1.png", "lesson1/L1/筆順-煩-部件-2.png", "lesson1/L1/筆順-煩-部件-3.png"], radical: "火", radicalChoices: ["火", "貝", "一", "頁"] },
            { char: "緩", components: ["lesson1/L1/筆順-緩-部件-1.png", "lesson1/L1/筆順-緩-部件-2.png", "lesson1/L1/筆順-緩-部件-3.png", "lesson1/L1/筆順-緩-部件-4.png"], radical: "糸", radicalChoices: ["糸", "又", "爪", "厂"] },
            { char: "邀", components: ["lesson1/L1/筆順-邀-部件-1.png", "lesson1/L1/筆順-邀-部件-2.png", "lesson1/L1/筆順-邀-部件-3.png", "lesson1/L1/筆順-邀-部件-4.png"], radical: "辵", radicalChoices: ["辵", "士", "方", "攵"] },
            { char: "螺", components: ["lesson1/L1/筆順-螺-部件-1.png", "lesson1/L1/筆順-螺-部件-2.png", "lesson1/L1/筆順-螺-部件-3.png"], radical: "虫", radicalChoices: ["虫", "田", "糸", "木"] },
            { char: "轉", components: ["lesson1/L1/筆順-轉-部件-1.png", "lesson1/L1/筆順-轉-部件-2.png", "lesson1/L1/筆順-轉-部件-3.png"], radical: "車", radicalChoices: ["車", "寸", "專", "手"] },
            { char: "躍", components: ["lesson1/L1/筆順-躍-部件-1.png", "lesson1/L1/筆順-躍-部件-2.png", "lesson1/L1/筆順-躍-部件-3.png"], radical: "足", radicalChoices: ["足", "羽", "隹", "鳥"] },
            { char: "鷹", components: ["lesson1/L1/筆順-鷹-部件-1.png", "lesson1/L1/筆順-鷹-部件-2.png", "lesson1/L1/筆順-鷹-部件-3.png", "lesson1/L1/筆順-鷹-部件-4.png"], radical: "鳥", radicalChoices: ["鳥", "广", "人", "隹"] },

            // 第二課
            { char: "束", components: ["lesson1/L2/筆順-束-部件-1.png", "lesson1/L2/筆順-束-部件-2.png"], radical: "木", radicalChoices: ["木", "口", "人", "水"] },
            { char: "依", components: ["lesson1/L2/筆順-依-部件-1.png", "lesson1/L2/筆順-依-部件-2.png"], radical: "人", radicalChoices: ["人", "衣", "木", "手"] },
            { char: "姐", components: ["lesson1/L2/筆順-姐-部件-1.png", "lesson1/L2/筆順-姐-部件-2.png"], radical: "女", radicalChoices: ["女", "且", "木", "人"] },
            { char: "幸", components: ["lesson1/L2/筆順-幸-部件-1.png", "lesson1/L2/筆順-幸-部件-2.png", "lesson1/L2/筆順-幸-部件-3.png"], radical: "干", radicalChoices: ["干", "土", "十", "手"] },
            { char: "拋", components: ["lesson1/L2/筆順-拋-部件-1.png", "lesson1/L2/筆順-拋-部件-2.png", "lesson1/L2/筆順-拋-部件-3.png"], radical: "手", radicalChoices: ["手", "力", "人", "水"] },
            { char: "招", components: ["lesson1/L2/筆順-招-部件-1.png", "lesson1/L2/筆順-招-部件-2.png", "lesson1/L2/筆順-招-部件-3.png"], radical: "手", radicalChoices: ["手", "刀", "口", "木"] },
            { char: "爭", components: ["lesson1/L2/筆順-爭-部件-1.png", "lesson1/L2/筆順-爭-部件-2.png"], radical: "爪", radicalChoices: ["爪", "手", "口", "木"] },
            { char: "則", components: ["lesson1/L2/筆順-則-部件-1.png", "lesson1/L2/筆順-則-部件-2.png"], radical: "刀", radicalChoices: ["刀", "貝", "人", "水"] },
            { char: "偷", components: ["lesson1/L2/筆順-偷-部件-1.png", "lesson1/L2/筆順-偷-部件-2.png", "lesson1/L2/筆順-偷-部件-3.png", "lesson1/L2/筆順-偷-部件-4.png", "lesson1/L2/筆順-偷-部件-5.png"], radical: "人", radicalChoices: ["人", "刀", "月", "一"] },
            { char: "捨", components: ["lesson1/L2/筆順-捨-部件-1.png", "lesson1/L2/筆順-捨-部件-2.png", "lesson1/L2/筆順-捨-部件-3.png"], radical: "手", radicalChoices: ["手", "人", "舌", "木"] },
            { char: "湯", components: ["lesson1/L2/筆順-湯-部件-1.png", "lesson1/L2/筆順-湯-部件-2.png", "lesson1/L2/筆順-湯-部件-3.png", "lesson1/L2/筆順-湯-部件-4.png"], radical: "水", radicalChoices: ["水", "日", "一", "手"] },
            { char: "暫", components: ["lesson1/L2/筆順-暫-部件-1.png", "lesson1/L2/筆順-暫-部件-2.png", "lesson1/L2/筆順-暫-部件-3.png"], radical: "日", radicalChoices: ["日", "車", "斤", "木"] },
            { char: "糧", components: ["lesson1/L2/筆順-糧-部件-1.png", "lesson1/L2/筆順-糧-部件-2.png", "lesson1/L2/筆順-糧-部件-3.png", "lesson1/L2/筆順-糧-部件-4.png"], radical: "米", radicalChoices: ["米", "日", "一", "里"] },
            { char: "繩", components: ["lesson1/L2/筆順-繩-部件-1.png", "lesson1/L2/筆順-繩-部件-2.png", "lesson1/L2/筆順-繩-部件-3.png", "lesson1/L2/筆順-繩-部件-4.png"], radical: "糸", radicalChoices: ["糸", "口", "虫", "水"] },
            { char: "警", components: ["lesson1/L2/筆順-警-部件-1.png", "lesson1/L2/筆順-警-部件-2.png"], radical: "言", radicalChoices: ["言", "敬", "口", "木"] }
        ];

        let currentWordIndex = 0;

        window.onload = () => {
            initGame();
        };

        function initGame() {
            currentWordIndex = 0;
            updateProgress();
            loadWord();
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const percentage = (currentWordIndex / lessonData.length) * 100;
            progressBar.style.width = percentage + '%';
            progressText.innerText = (currentWordIndex + 1) + ' / ' + lessonData.length;
        }

        const renderPieceContent = (content) => {
            const lowerContent = content.toLowerCase();
            if (lowerContent.endsWith('.png') || lowerContent.endsWith('.jpg') || lowerContent.endsWith('.jpeg')) {
                return `<img src="${content}" alt="部件" class="w-full h-full object-contain pointer-events-none" onerror='this.outerHTML="<div class=\\"text-xs lg:text-sm text-red-500 font-bold break-all p-1 leading-tight flex items-center justify-center text-center w-full h-full\\">找不到圖片:<br>${content}</div>"'>`;
            } else {
                return content;
            }
        };

        function loadWord() {
            document.getElementById('assemblyStage').classList.remove('hidden');
            document.getElementById('radicalStage').classList.add('hidden');
            document.getElementById('finishBtn').classList.add('hidden');
            
            // 清空田字格並保留十字線
            document.getElementById('targetBox').innerHTML = `
                <div class="absolute inset-0 pointer-events-none flex flex-col justify-center items-center z-0">
                    <div class="w-full h-[2px] bg-gray-300 border-dashed"></div>
                </div>
                <div class="absolute inset-0 pointer-events-none flex flex-row justify-center items-center z-0">
                    <div class="h-full w-[2px] bg-gray-300 border-dashed"></div>
                </div>
            `; 
            
            const currentData = lessonData[currentWordIndex];
            let currentOptions = [...currentData.components];
            currentOptions.sort(() => Math.random() - 0.5);

            const optionsBox = document.getElementById('optionsBox');
            optionsBox.innerHTML = '';

            currentOptions.forEach((comp) => {
                const pieceDiv = document.createElement('div');
                const isImage = comp.toLowerCase().endsWith('.png') || comp.toLowerCase().endsWith('.jpg');
                const paddingClass = isImage ? 'p-2 sm:p-3' : 'p-3 sm:p-6';

                // 右側待選卡片調大 (加大到 w-32 h-32 至 w-44 h-44)
                pieceDiv.className = `draggable-piece touch-none w-32 h-32 sm:w-36 sm:h-36 lg:w-44 lg:h-44 bg-white border-4 border-gray-200 rounded-2xl lg:rounded-3xl shadow-md hover:shadow-xl hover:border-blue-400 cursor-grab active:cursor-grabbing flex items-center justify-center text-5xl lg:text-8xl font-bold text-gray-700 z-10 ${paddingClass} relative transition-shadow`;
                
                pieceDiv.innerHTML = renderPieceContent(comp);
                pieceDiv.dataset.compContent = comp; 
                
                pieceDiv.addEventListener('pointerdown', onPointerDown);
                optionsBox.appendChild(pieceDiv);
            });
        }

        let draggedPiece = null;
        let shiftX = 0;
        let shiftY = 0;
        let placeholder = null;

        function onPointerDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault(); 
            
            draggedPiece = e.currentTarget;
            
            // 計算抓取位置相對座標
            const rect = draggedPiece.getBoundingClientRect();
            shiftX = e.clientX - rect.left;
            shiftY = e.clientY - rect.top;

            // 在原位置建立占位元素防止選單塌陷
            placeholder = document.createElement('div');
            placeholder.className = draggedPiece.className;
            placeholder.style.visibility = 'hidden';
            draggedPiece.parentNode.insertBefore(placeholder, draggedPiece);
            
            // 移到 body 層級拖曳
            document.body.appendChild(draggedPiece);
            
            // ★ 核心升級：拖動時套用透明樣式（消除白底、消除邊框、放大部件尺寸）
            draggedPiece.classList.add('is-dragging');
            // 放大拖曳中的部件容器大小 (由原本 tiny 尺寸升級至大螢幕放大版)
            draggedPiece.style.width = '240px';
            draggedPiece.style.height = '240px';
            if (window.innerWidth >= 1024) {
                draggedPiece.style.width = '340px';
                draggedPiece.style.height = '340px';
            }
            
            // 將按壓偏移量重新根據新尺寸微調置中，讓手指/游標剛好抓在圖片中心附近
            shiftX = parseInt(draggedPiece.style.width) / 2;
            shiftY = parseInt(draggedPiece.style.height) / 2;

            moveAt(e.clientX, e.clientY);
        }

        function onPointerMove(e) {
            if (!draggedPiece) return;
            e.preventDefault(); 
            moveAt(e.clientX, e.clientY);
        }

        function moveAt(pageX, pageY) {
            draggedPiece.style.left = (pageX - shiftX) + 'px';
            draggedPiece.style.top = (pageY - shiftY) + 'px';
        }

        function onPointerUp(e) {
            if (!draggedPiece) return;
            
            // 清理拖曳狀態
            draggedPiece.classList.remove('is-dragging');
            draggedPiece.style.position = '';
            draggedPiece.style.left = '';
            draggedPiece.style.top = '';
            draggedPiece.style.zIndex = '';
            draggedPiece.style.margin = '';
            
            const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            const targetBox = document.getElementById('targetBox');
            const optionsBox = document.getElementById('optionsBox');
            
            // 判斷是否落在紅框(田字格)區域
            if (elemBelow && (elemBelow === targetBox || targetBox.contains(elemBelow))) {
                targetBox.appendChild(draggedPiece);
                draggedPiece.classList.add('in-target');
                
                // 設定大尺寸 (田字格組裝時部件大小大增)
                draggedPiece.style.width = '240px';
                draggedPiece.style.height = '240px';
                if (window.innerWidth >= 1024) {
                    draggedPiece.style.width = '340px';
                    draggedPiece.style.height = '340px';
                }

                // 計算田字格內的相對座標
                const boxRect = targetBox.getBoundingClientRect();
                let newLeft = e.clientX - boxRect.left - shiftX;
                let newTop = e.clientY - boxRect.top - shiftY;
                
                draggedPiece.style.left = newLeft + 'px';
                draggedPiece.style.top = newTop + 'px';
                
            } else {
                // 如果落在外面，退回待選區 (恢復白色卡片外觀與大小)
                optionsBox.appendChild(draggedPiece);
                draggedPiece.classList.remove('in-target');
                draggedPiece.style.width = '';
                draggedPiece.style.height = '';
            }
            
            if (placeholder && placeholder.parentNode) {
                placeholder.parentNode.removeChild(placeholder);
            }
            
            draggedPiece = null;
            placeholder = null;
            
            checkAssemblyState();
        }

        document.addEventListener('pointermove', onPointerMove, { passive: false });
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerUp);

        function checkAssemblyState() {
            const currentData = lessonData[currentWordIndex];
            const targetBox = document.getElementById('targetBox');
            const finishBtn = document.getElementById('finishBtn');
            
            const piecesInTarget = Array.from(targetBox.children).filter(el => el.dataset.compContent);
            
            if (piecesInTarget.length === currentData.components.length) {
                finishBtn.classList.remove('hidden');
                finishBtn.classList.add('animate-popIn');
            } else {
                finishBtn.classList.add('hidden');
                finishBtn.classList.remove('animate-popIn');
            }
        }

        function finishAssembly() {
            const targetBox = document.getElementById('targetBox');
            
            targetBox.classList.replace('border-gray-400', 'border-green-400');
            targetBox.classList.add('bg-green-100');
            showFeedback(true, "組裝完成！");
            
            setTimeout(() => {
                targetBox.classList.replace('border-green-400', 'border-gray-400');
                targetBox.classList.remove('bg-green-100');
                showRadicalSelection();
            }, 800);
        }

        function showRadicalSelection() {
            document.getElementById('assemblyStage').classList.add('hidden');
            document.getElementById('finishBtn').classList.add('hidden');
            
            const radicalStage = document.getElementById('radicalStage');
            radicalStage.classList.remove('hidden');
            radicalStage.classList.add('animate-popIn');
            
            const currentData = lessonData[currentWordIndex];
            document.getElementById('completedWordDisplay').innerText = currentData.char;
            
            const radicalOptionsBox = document.getElementById('radicalOptionsBox');
            radicalOptionsBox.innerHTML = '';
            
            let choices = [...currentData.radicalChoices];
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "group relative bg-white border-4 border-pink-200 text-pink-700 text-3xl sm:text-4xl lg:text-6xl font-bold w-20 h-20 sm:w-28 sm:h-28 lg:w-40 lg:h-40 rounded-2xl lg:rounded-3xl shadow-md hover:bg-pink-50 hover:border-pink-400 hover:shadow-xl transition-all hover:-translate-y-2 flex items-center justify-center overflow-hidden";
                
                btn.innerHTML = `<span class="relative z-10 pointer-events-none">${choice}</span>`;
                btn.onclick = () => selectRadical(choice);
                radicalOptionsBox.appendChild(btn);
            });
        }

        function selectRadical(choice) {
            const currentData = lessonData[currentWordIndex];
            if (choice === currentData.radical) {
                showFeedback(true, "正確");
                setTimeout(nextWord, 800);
            } else {
                showFeedback(false, "錯誤");
            }
        }

        function nextWord() {
            currentWordIndex++;
            if (currentWordIndex >= lessonData.length) {
                document.getElementById('completionModal').classList.remove('hidden');
            } else {
                updateProgress();
                loadWord();
            }
        }

        function showFeedback(isCorrect, message) {
            const feedbackModal = document.getElementById('feedbackModal');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');

            feedbackModal.classList.remove('hidden');
            
            if (isCorrect) {
                feedbackIcon.className = "text-[5rem] lg:text-[8rem] mb-2 text-green-500";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feedbackText.className = "text-3xl lg:text-5xl font-black text-green-600";
            } else {
                feedbackIcon.className = "text-[5rem] lg:text-[8rem] mb-2 text-red-500 animate-shake";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                feedbackText.className = "text-3xl lg:text-5xl font-black text-red-600";
            }
            feedbackText.textContent = message;

            setTimeout(() => {
                feedbackModal.classList.add('hidden');
            }, 800);
        }
    </script>
</body>
</html>
