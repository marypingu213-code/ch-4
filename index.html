<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國語遊戲大廳</title>
    <!-- 引入 Tailwind CSS 進行快速且美觀的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 作為圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基礎樣式設定 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'BiaoKai', 'DFKai-SB', '楷體-繁', 'Kaiti TC', 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none;
        }

        /* 動畫效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .group-hover\:animate-shake:hover { animation: shake 0.4s ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
        .animate-bounce-slow { animation: bounce-slow 2s infinite; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-4xl bg-white/90 backdrop-blur-sm p-8 md:p-12 rounded-[2.5rem] shadow-2xl flex flex-col items-center">
        <!-- 大廳標題 -->
        <h1 class="text-4xl md:text-6xl font-black text-green-600 mb-4 drop-shadow-md animate-float flex items-center gap-4 text-center">
            <i class="fa-solid fa-gamepad text-orange-400 font-sans"></i>
            國語遊戲大廳
            <i class="fa-solid fa-gamepad text-yellow-400 font-sans"></i>
        </h1>
        <p class="text-xl md:text-2xl text-gray-600 mb-10 font-bold border-b-4 border-green-200 pb-2 font-sans">請選擇要挑戰的關卡！</p>
        
        <!-- 關卡選單網格 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-3xl">
            
            <!-- 第一關：部件組合 -->
            <a href="lesson1.html" class="block group relative bg-gradient-to-br from-green-400 to-emerald-600 rounded-3xl p-8 text-white shadow-xl hover:shadow-2xl hover:scale-105 transition-all duration-300 border-4 border-white cursor-pointer no-underline">
                <div class="absolute -top-4 -right-4 bg-yellow-400 text-yellow-900 font-bold px-4 py-1 rounded-full shadow-md animate-bounce-slow z-10 font-sans">Start!</div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-3xl font-black group-hover:animate-shake">第一關</h2>
                    <i class="fa-solid fa-puzzle-piece text-4xl text-green-200 opacity-80 font-sans"></i>
                </div>
                <p class="text-green-100 text-lg font-bold">組合部件與找部首</p>
            </a>

            <!-- 第二關：句子重組 -->
            <a href="lesson2.html" class="block group relative bg-gradient-to-br from-blue-400 to-indigo-600 rounded-3xl p-8 text-white shadow-xl hover:shadow-2xl hover:scale-105 transition-all duration-300 border-4 border-white cursor-pointer no-underline">
                <div class="absolute -top-4 -right-4 bg-yellow-400 text-yellow-900 font-bold px-4 py-1 rounded-full shadow-md animate-bounce-slow z-10 font-sans">Start!</div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-3xl font-black group-hover:animate-shake">第二關</h2>
                    <i class="fa-solid fa-list-ol text-4xl text-blue-200 opacity-80 font-sans"></i>
                </div>
                <p class="text-blue-100 text-lg font-bold">句子重組大挑戰</p>
            </a>

            <!-- 第三關：改錯字 -->
            <a href="lesson3.html" class="block group relative bg-gradient-to-br from-purple-400 to-fuchsia-600 rounded-3xl p-8 text-white shadow-xl hover:shadow-2xl hover:scale-105 transition-all duration-300 border-4 border-white cursor-pointer no-underline">
                <div class="absolute -top-4 -right-4 bg-yellow-400 text-yellow-900 font-bold px-4 py-1 rounded-full shadow-md animate-bounce-slow z-10 font-sans">Start!</div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-3xl font-black group-hover:animate-shake">第三關</h2>
                    <i class="fa-solid fa-eraser text-4xl text-purple-200 opacity-80 font-sans"></i>
                </div>
                <p class="text-purple-100 text-lg font-bold">火眼金睛改錯字</p>
            </a>

            <!-- 第四關：選擇題 -->
            <a href="lesson4.html" class="block group relative bg-gradient-to-br from-orange-400 to-rose-500 rounded-3xl p-8 text-white shadow-xl hover:shadow-2xl hover:scale-105 transition-all duration-300 border-4 border-white cursor-pointer no-underline">
                <div class="absolute -top-4 -right-4 bg-yellow-400 text-yellow-900 font-bold px-4 py-1 rounded-full shadow-md animate-bounce-slow z-10 font-sans">Start!</div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-3xl font-black group-hover:animate-shake">第四關</h2>
                    <i class="fa-solid fa-list-check text-4xl text-orange-200 opacity-80 font-sans"></i>
                </div>
                <p class="text-orange-100 text-lg font-bold">語文綜合選擇題</p>
            </a>

        </div>
    </div>

</body>
</html>
